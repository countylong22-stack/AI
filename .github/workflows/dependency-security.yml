name: Rooster Dependency Security

on:
  push:
    branches: [main, 'v2/**', 'feature/**']
  pull_request:
    branches: [main, 'v2/**']
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Install dependency auditor
        run: python -m pip install pip-audit
      - name: Audit resolved dependency versions
        run: pip-audit -r requirements.txt
